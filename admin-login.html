<!DOCTYPE html>
<html lang="en">

<head>
<link
rel="icon"
type="image/png"
sizes="32x32"
href="images/logo/favicon-32.png">

<link
rel="icon"
type="image/png"
sizes="16x16"
href="images/logo/favicon-16.png">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">


<title>Admin Login | Nagaland Skilled Services</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>

<body class="bg-light">

<div class="container">

<div class="row justify-content-center align-items-center vh-100">

<div class="col-lg-5">

<div class="application-card">

<div class="text-center mb-4">

<div class="text-center mb-4">

    <img
        src="images/logo/logo-ho.png"
        height="120">

</div>

<h2 class="fw-bold">

Admin Login

</h2>

<p class="text-muted">

Nagaland Skilled Services Administration

</p>

</div>

<div class="mb-3">

<label>Email</label>

<input
id="adminEmail"
type="email"
class="form-control"
placeholder="admin@nss.com">

</div>

<div class="mb-4">

<label>Password</label>

<input
id="adminPassword"
type="password"
class="form-control"
placeholder="Password">

</div>

<button
id="loginBtn"
class="btn btn-warning w-100 btn-lg">

Login

</button>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script type="module" src="js/admin-login.js"></script>

</body>

</html>
